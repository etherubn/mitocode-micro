server:
  port: ${CUSTOM.SERVER.PORT:9010}

#enable actuator
management:
  endpoints:
    web:
      exposure:
        include: '*'
        base-path: /actuator

#resilencia4j configuration
resilience4j:
  circuitbreaker:
    configs:
      product-service-circuit-breaker:
        slidingWindowSize: 15 #Cuabntas peticiones se van a analizar
        failureRateThreshold: 20 # porcentaje de peticione malas
        waitDurationInOpenState: 20 #tiempo que va a estar en circuito abierto
        permittedNumberOfCallsInHalfOpenState: 9 # van a analizar 9 en semiabierto
      instances:
        mitocode-product:
          base-config: product-service-circuit-breaker
